AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'trading-strategy-backtester

  Serverless Spring Boot 3 API

  '
Globals:
  Function:
    Timeout: 30
    MemorySize: 2048
    Runtime: java21
Resources:
  BacktesterApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowMethods:
        - GET
        - POST
        - OPTIONS
        AllowHeaders:
        - '*'
  BacktesterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: BacktesterFunction
      Handler: com.fintech.backtester.StreamLambdaHandler::handleRequest
      SnapStart:
        ApplyOn: PublishedVersions
      Events:
        HttpApiEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: BacktesterApi
            Path: /{proxy+}
            Method: ANY
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: BacktestResultsTable
      Environment:
        Variables:
          JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1
          TABLE_NAME:
            Ref: BacktestResultsTable
    Metadata:
      SamResourceId: BacktesterFunction
  BacktestResultsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
Outputs:
  BacktesterApiUrl:
    Description: URL of the API Gateway
    Value:
      Fn::Sub: https://${BacktesterApi}.execute-api.${AWS::Region}.amazonaws.com/prod
